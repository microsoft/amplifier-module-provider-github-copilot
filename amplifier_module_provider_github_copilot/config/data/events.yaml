# Event Bridge Classification
# Contract: contracts/event-vocabulary.md
# SDK Reference: github-copilot-sdk SessionEventType enum
version: "1.0"

# Content event types for TTFT (time to first token) tracking
# Contract: behaviors:Streaming:MUST:1
# Any of these event types arriving starts the TTFT clock
content_event_types:
  - assistant.message_delta
  - assistant.streaming_delta
  - assistant.reasoning_delta

# Streaming emission configuration
# Contract: streaming-contract:ProgressiveStreaming:SHOULD:1
# Maps event types to content block types for real-time UI emission
streaming_emission:
  text_content_types:
    - assistant.message_delta
    - assistant.streaming_delta
  # thinking_content_types: enabled for provider-streaming-contract compliance.
  # EventRouter uses these types to call stream_ctx.handle_delta(text, "thinking"),
  # emitting llm:stream_block_delta with block_type="thinking" per token.
  # The old per-token ThinkingContent (llm:content_block) is retired.
  # Contract: provider-streaming-contract:llm:stream_block_delta
  thinking_content_types:
    - assistant.reasoning_delta

event_classifications:
  bridge:
    # Content events - map SDK dotted names to domain types
    - sdk_type: assistant.message_delta
      domain_type: CONTENT_DELTA
      block_type: TEXT
    - sdk_type: assistant.streaming_delta
      domain_type: CONTENT_DELTA
      block_type: TEXT
    - sdk_type: assistant.reasoning_delta
      domain_type: CONTENT_DELTA
      block_type: THINKING
    # Completion events
    - sdk_type: tool.execution_complete
      domain_type: TOOL_CALL
    - sdk_type: tool_use_complete  # Legacy underscore alias
      domain_type: TOOL_CALL
    - sdk_type: assistant.turn_end
      domain_type: TURN_COMPLETE
    - sdk_type: assistant.message
      domain_type: TURN_COMPLETE
    - sdk_type: message_complete  # Legacy underscore alias
      domain_type: TURN_COMPLETE
    # Usage and status events
    - sdk_type: assistant.usage
      domain_type: USAGE_UPDATE
    - sdk_type: usage_update  # Legacy underscore alias
      domain_type: USAGE_UPDATE
    - sdk_type: session.idle
      domain_type: TURN_COMPLETE  # session.idle triggers TURN_COMPLETE per contract
    - sdk_type: session.error
      domain_type: ERROR

  consume:
    - assistant.turn_start  # SDK v0.1.33 - turn lifecycle, consume internally
    - assistant.message_start  # SDK v1.0.0b4 - turn-boundary marker, consume internally
    - assistant.reasoning  # SDK v0.1.33 - final reasoning summary, consume internally
    - assistant.intent  # SDK v0.2.0 - intent report echo, consume internally
    - tool.execution_start
    - tool_use_start  # Legacy underscore alias
    - tool.execution_progress
    - session.start
    - session.shutdown
    - session.usage_info
    - system.notification  # SDK v0.1.33 - log internally, don't forward
    - system_notification  # Legacy underscore alias

  drop:
    - tool.execution_partial_result
    - tool.user_requested
    - permission.*
    - session.context_changed
    - session.background_tasks_changed
    - session.compaction_*
    - session.truncation
    - session.workspace_file_changed
    - session.snapshot_rewind
    - session.info
    - session.warning
    - session.title_changed
    - session.plan_changed
    - session.mode_changed
    - session.model_change
    - session.tools_updated
    - session.custom_agents_updated  # CLI binary sends this on session init; no domain value
    - session.skills_loaded  # SDK SessionSkillsLoadedEvent — Amplifier does not host skills; no domain value
    - system.message          # SDK SystemMessageEvent — carries system/developer prompt text; not forwarded (no domain value)
    - session.handoff
    - session.resume
    - session.task_complete
    - hook.*
    - elicitation.*  # provider-initiated UI dialogs
    - command.*      # slash command dispatch (singular)
    - commands.changed  # plural variant; not matched by `command.*` wildcard
    - capabilities.changed  # CLI host capability changes
    # SDK 0.3.0 enum members (verified via meta-test against
    # copilot.generated.session_events.SessionEventType). Classified DROP:
    # provider's surface is single-completion + tool-call deltas; lifecycle,
    # MCP, sampling, and auto-mode notifications carry no domain value.
    - auto_mode_switch.requested
    - auto_mode_switch.completed
    - mcp.oauth_required
    - mcp.oauth_completed
    - sampling.requested
    - sampling.completed
    - session.extensions_loaded
    - session.mcp_servers_loaded
    - session.mcp_server_status_changed
    - session.remote_steerable_changed
    - subagent.*
    - skill.*
    - user.*
    - external_tool.*
    - exit_plan_mode.*
    - user_input.*
    - pending_messages.*
    - abort
    - unknown
    # SDK v1.0.0b4 — schedule lifecycle markers (no domain value; same pattern
    # as session.task_complete / session.handoff above).
    - session.schedule_created
    - session.schedule_cancelled
    # SDK v1.0.0b4 — per-model upstream failure notification. Provider relies on
    # the existing session.error → ERROR bridge to surface user-visible errors;
    # this enum member duplicates that signal at a lower granularity. Dropped
    # to avoid double-emitting ERROR events from the same failure.
    - model.call_failure
    # SDK v1.0.0b9 — autopilot objective state-file CRUD telemetry. Amplifier
    # does not host the autopilot objectives UI; no domain mapping exists.
    - session.autopilot_objective_changed
    # SDK v1.0.0b9 — aggregate allow-all permissions transition. Provider
    # surfaces permission decisions through the PermissionHandler contract,
    # not by forwarding raw session-wide toggle events. The pre-existing
    # `permission.*` wildcard does not match this `session.` prefix, so an
    # explicit entry is required.
    - session.permissions_changed
    # SDK v1.0.0b9 — opaque source-defined notification envelope (payload
    # semantics are not defined by the SDK). With no schema to translate,
    # there is nothing the provider can map to a kernel domain event.
    - session.custom_notification
    # SDK v1.0.0b9 — canvas UI lifecycle and registry mutations. Amplifier
    # has no canvas surface; same disposition as session.skills_loaded /
    # session.extensions_loaded above.
    - session.canvas.opened
    - session.canvas.registry_changed
    # SDK v1.0.0b9 — MCP App view's own tool-call telemetry (duration,
    # server, success). Kernel tool-call signal travels via the
    # tool.execution_complete bridge; forwarding this would double-emit
    # under a different schema.
    - mcp_app.tool_call_complete
    # SDK v1.0.0b12 — extension-SDK attachment push. MinimalMode disables the
    # extension surface (enable_skills=False and no extension_sdk_path is ever
    # passed), so this is unreachable; and it carries no domain value. Same
    # disposition as session.extensions_loaded above.
    - session.extensions.attachments_pushed
    # SDK v1.0.2 — three new SessionEventType enum members. Same disposition as
    # their sibling lifecycle/canvas events already dropped above; none carry a
    # kernel domain mapping for this provider's single-completion + tool-call
    # surface.
    #   session.todos_changed  — autopilot/objective todo-list telemetry; no UI host.
    #   session.binary_asset    — inbound binary-result delivery (SessionBinaryAssetData:
    #                             asset_id/mime_type/byte_length/data/type). DROP + a
    #                             metadata-only DEBUG tripwire in translate_event; the
    #                             base64 `data` field is never read or logged.
    #   session.canvas.closed   — canvas UI lifecycle; Amplifier has no canvas surface
    #                             (mirrors session.canvas.opened above).
    - session.todos_changed
    - session.binary_asset
    - session.canvas.closed
    # SDK v1.0.6 (bundled CLI 1.0.69) — 12 new SessionEventType enum members.
    # All DROP: the provider's domain surface is single-completion + tool-call +
    # usage + error + content-deltas; none of these carry a kernel domain mapping.
    # Each is grouped with its already-dropped siblings above.
    #   assistant.tool_call_delta — streaming tool-call *input* delta (partial
    #     argument tokens: input_delta/tool_call_id/tool_name/tool_type). No
    #     streaming-tool-call domain type exists; the complete tool call is
    #     delivered via tool.execution_complete -> TOOL_CALL, and forwarding
    #     partial args as content would corrupt the text stream. Mirrors
    #     tool.execution_partial_result (also DROP).
    #   assistant.idle — main-loop idle that can fire while the session-level
    #     idle event is DEFERRED (background work still pending). Bridging would
    #     emit TURN_COMPLETE prematurely and double-emit when session.idle fires;
    #     session.idle remains the authoritative TURN_COMPLETE source (cf. the
    #     model.call_failure double-emit rationale above).
    #   session.usage_checkpoint — durable resume-accounting checkpoint
    #     (total_nano_aiu); live per-turn usage travels via assistant.usage ->
    #     USAGE_UPDATE, so this persistence artifact has no per-turn mapping.
    #   session.session_limits_changed — session-limits state telemetry
    #     (SessionLimitsConfig | None); no domain value.
    #   session.schedule_rearmed — self-paced schedule re-arm marker; sibling of
    #     session.schedule_created / session.schedule_cancelled above.
    #   session_limits_exhausted.requested / .completed — limits-exhaustion
    #     handling flow markers (request/completed pattern, cf. auto_mode_switch.*).
    #   mcp.headers_refresh_required / .completed — MCP header/auth refresh
    #     lifecycle; sibling of mcp.oauth_required / mcp.oauth_completed above.
    #   session.canvas.unavailable / .recorded / .removed — canvas UI lifecycle;
    #     Amplifier hosts no canvas surface (cf. session.canvas.opened / .closed).
    - assistant.tool_call_delta
    - assistant.idle
    - session.usage_checkpoint
    - session.session_limits_changed
    - session.schedule_rearmed
    - session_limits_exhausted.requested
    - session_limits_exhausted.completed
    - mcp.headers_refresh_required
    - mcp.headers_refresh_completed
    - session.canvas.unavailable
    - session.canvas.recorded
    - session.canvas.removed
    # SDK v1.0.7 (bundled CLI 1.0.70) — 6 new SessionEventType enum members.
    # All DROP: the provider's domain surface is single-completion + tool-call +
    # usage + error + content-deltas; none of these carry a kernel domain mapping.
    # Each is grouped with its already-dropped siblings above.
    #   assistant.server_tool_progress — live progress signal for a
    #     provider-hosted SERVER tool (e.g. hosted web search) while it runs
    #     (AssistantServerToolProgressData: kind/output_index/status), before the
    #     finalized serverTools envelope lands on the terminal assistant.message.
    #     Amplifier forwards only kernel-layer tool calls; the completed
    #     server-tool result rides assistant.message, so this partial telemetry
    #     has no domain type. Mirrors assistant.tool_call_delta / assistant.idle.
    #   session.auto_mode_resolved — EXPERIMENTAL. Auto-Intent model-resolution
    #     analytics (SessionAutoModeResolvedData: chosen_model + routing scores).
    #     The provider selects models explicitly and never drives auto-mode, so
    #     this carries no domain value (sibling of the auto_mode_switch.* markers).
    #   session.managed_settings_resolved — EXPERIMENTAL. Enterprise
    #     managed-settings snapshot (SessionManagedSettingsResolvedData); an
    #     ephemeral policy-display signal, not persisted to the event log. No
    #     kernel domain mapping; the SDK getManagedSettings() API is the pull path.
    #   mcp.tools.list_changed / mcp.resources.list_changed /
    #     mcp.prompts.list_changed — MCP list-change notifications
    #     ({server_name} only). Siblings of the mcp.oauth_* / mcp.headers_*
    #     lifecycle events already dropped above; Amplifier hosts no MCP list
    #     subscription surface in this provider.
    - assistant.server_tool_progress
    - session.auto_mode_resolved
    - session.managed_settings_resolved
    - mcp.tools.list_changed
    - mcp.resources.list_changed
    - mcp.prompts.list_changed
    # SDK v1.0.15 (bundled CLI 1.0.89): 40 new SessionEventType enum members
    # since v1.0.7. All DROP: the provider's domain surface is single-completion
    # + tool-call + usage + error + content-deltas; none of these carry a kernel
    # domain mapping. Ten are already covered by the existing wildcards above:
    # permission.assentDetected / .carriedForward / .contextualAuthorization /
    # .messageAuthorization / .messageAuthorizationDegraded /
    # .messageAuthorizationRead (permission.*), skill.context_delivered /
    # .context_delivered_ref / .invoked_ref (skill.*), subagent.configured
    # (subagent.*). The remaining 30 are listed explicitly:
    #   assistant.turn_retry: extra model inference attempt inside an existing
    #     turn (turn_id/model/reason). The retried output still arrives via the
    #     bridged message/usage events; bridging this marker would add nothing.
    #   agent.interrupted: user-interrupt telemetry (activity/elapsed/tool
    #     names). The provider aborts sessions itself after tool capture; turn
    #     completion and failures travel via session.idle / session.error.
    #   model.call_start / model.call_finished: per-dispatch model lifecycle
    #     telemetry; siblings of model.call_failure (DROP above). Usage rides
    #     assistant.usage -> USAGE_UPDATE.
    #   prompt_cache_break: prompt-cache loss diagnostics; no domain value.
    #   session.completion_receipt: behavior-neutral record of runtime facts at
    #     completion; TURN_COMPLETE already comes from assistant.message /
    #     session.idle, so bridging would double-emit.
    #   session.context_cleared: host-initiated history clear; the provider never
    #     clears SDK history (ephemeral per-complete() sessions).
    #   assistant.fusion_phase_started / _activity / _completed / _failed,
    #     session.fusion_route_started / _route_failed / _resolved / _completed:
    #     EXPERIMENTAL HydraFusion multi-model routing telemetry; the provider
    #     selects models explicitly.
    #   session.auto_tier_recommendation / session.auto_tier_switch_failed:
    #     Auto-tier preference signals; siblings of auto_mode_switch.* and
    #     session.auto_mode_resolved (DROP above).
    #   session.model_deselected: explicit model withdrawn by its publishing host;
    #     the provider passes the model on every create_session.
    #   session.mode_notice_delivered: mode-transition notice bookkeeping for
    #     resume; sibling of session.mode_changed (DROP above).
    #   session.permission_recovery: Autopilot permission-recovery snapshot;
    #     sibling of session.permissions_changed (DROP above). The provider
    #     denies every permission request (deny-destroy).
    #   sandbox.decision: process-sandbox governance record; the SDK executes no
    #     tools under deny-destroy, so there is nothing to surface.
    #   session.indexed_search: transient indexed-search diagnostics; Amplifier
    #     owns retrieval (skip_embedding_retrieval=True).
    #   session.managed_settings_enforced: enterprise-policy enforcement notice;
    #     sibling of session.managed_settings_resolved (DROP above).
    #   session.mcp_server_removed / session.mcp_server_needs_reconnect: MCP
    #     server lifecycle; siblings of session.mcp_server_status_changed (DROP
    #     above). mcp_servers={} (MinimalMode:MUST:3).
    #   tool_search.activated: lazy tool-search activations restored on resume;
    #     the provider sets defer=None on every tool and never resumes sessions.
    #   ui.ephemeral_query: transient side-query output that does not modify
    #     conversation history; no UI host.
    #   workflow.run_started / _updated / _settled: ephemeral workflow-run
    #     lifecycle signals; Amplifier orchestrates its own workflows.
    - assistant.turn_retry
    - agent.interrupted
    - model.call_start
    - model.call_finished
    - prompt_cache_break
    - session.completion_receipt
    - session.context_cleared
    - assistant.fusion_phase_started
    - assistant.fusion_phase_activity
    - assistant.fusion_phase_completed
    - assistant.fusion_phase_failed
    - session.fusion_route_started
    - session.fusion_route_failed
    - session.fusion_resolved
    - session.fusion_completed
    - session.auto_tier_recommendation
    - session.auto_tier_switch_failed
    - session.model_deselected
    - session.mode_notice_delivered
    - session.permission_recovery
    - sandbox.decision
    - session.indexed_search
    - session.managed_settings_enforced
    - session.mcp_server_removed
    - session.mcp_server_needs_reconnect
    - tool_search.activated
    - ui.ephemeral_query
    - workflow.run_started
    - workflow.run_updated
    - workflow.run_settled

finish_reason_map:
  # Values MUST be lowercase to match amplifier-core proto:
  #   "stop", "tool_calls", "length", "content_filter"
  end_turn: stop
  stop: stop
  tool_use: tool_calls
  max_tokens: length
  content_filter: content_filter
  "": stop  # SDK often sends empty/missing finish_reason for normal completion
  _default: stop  # Normal completion when SDK doesn't specify

# Session lifecycle event classification
# Used by event_helpers.py for SDK event type detection
session_lifecycle:
  idle_events:
    - session.idle
    - session_idle
    - idle
  error_events:
    - error
    - session.error
    - session_error
    - sdk_error
  usage_events:
    - assistant.usage
    - usage_update

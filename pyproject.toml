[project]
name = "amplifier-module-provider-github-copilot"
version = "2.8.0"
description = "GitHub Copilot provider for Amplifier - Two-Medium Architecture"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Amplifier Team", email = "amplifier@microsoft.com"}
]
keywords = ["amplifier", "github-copilot", "llm", "provider", "ai", "language-model"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    # GitHub Copilot SDK
    # - v1.0.0b7: SubprocessConfig removed; CopilotClient takes direct kwargs
    # - v1.0.0b9: on_list_models + mode kwargs (additive)
    # - v1.0.0b10: 8 new create_session kwargs + telemetry consolidation
    #   (MinimalMode:MUST:7-15)
    # - v1.0.0b12: bundled CLI 1.0.57; copilot.rpc stable public shim;
    #   one new SessionEventType (session.extensions.attachments_pushed)
    # - v1.0.0 (GA): byte-identical Python source to b12 (bundled CLI 1.0.57);
    #   stable release stamp — no API or behavior change vs b12
    # - v1.0.1 / v1.0.2: NON-BREAKING for our 4 SDK imports — top-level `copilot`
    #   exports `ModelCapabilitiesOverride`, `ModelLimitsOverride`,
    #   `PermissionRequestResult`; `PermissionDecisionReject` lives in
    #   `copilot.generated.rpc` (guarded boundary carve-out, ImportQuarantine:MUST:7).
    #   None were removed or renamed across GA -> 1.0.1 -> 1.0.2.
    #   v1.0.2 adds graceful runtime shutdown on CopilotClient.stop() (bounded by
    #   _RUNTIME_SHUTDOWN_TIMEOUT_SECONDS) — lands on the once-per-lifecycle close()
    #   path, not the per-turn session disconnect path.
    # - v1.0.6 (stable; bundled CLI 1.0.69): NON-BREAKING for our SDK imports —
    #   same symbols/shapes as 1.0.2 (protocol version unchanged). Surfaces the
    #   server-driven GPT-5.6 model family via list_models (no provider allowlist).
    #   Adds `httpx` as a new runtime dependency (pulled in via uv.lock).
    # - v1.0.7 (stable; bundled CLI 1.0.70): the SDK `copilot.tools.Tool`
    #   dataclass gains a trailing `metadata: dict | None = None` field, which
    #   `copilot/client.py` reads by attribute in BOTH create_session and resume
    #   (`if tool.metadata is not None: definition["metadata"] = tool.metadata`).
    #   Duck-typed `SDKToolWrapper` MUST mirror it (see sdk_adapter/types.py) or
    #   every tool-forwarding turn raises AttributeError — same shape as the
    #   v1.0.2 `defer` regression. Also adds 6 new SessionEventType members
    #   (all DROP; see config/data/events.yaml). No other import shape changed.
    # - v1.0.14 (stable; bundled CLI 1.0.77): the 5 quarantined SDK imports
    #   (CopilotClient, ModelCapabilitiesOverride, ModelLimitsOverride,
    #   PermissionDecisionReject, PermissionRequestResult) are UNCHANGED in
    #   name, location and shape. Nothing was removed or renamed across
    #   1.0.8 -> 1.0.14: `CopilotClient.__init__`, `create_session` and
    #   `CopilotSession.send` are all purely additive (verified by signature
    #   set-difference; REMOVED == none for each). Four absorbed changes:
    #   1. `copilot.tools.Tool` gains a trailing `is_terminal: bool = False`,
    #      which `copilot/client.py` reads by attribute in BOTH create_session
    #      (:2570) and resume (:3355) as `if tool.is_terminal:`. Duck-typed
    #      `SDKToolWrapper` MUST mirror it (see sdk_adapter/types.py) or every
    #      tool-forwarding turn raises AttributeError -- same shape as the
    #      v1.0.2 `defer` and v1.0.7 `metadata` regressions. NOTE this one is a
    #      truthiness gate, not `is not None`; False omits the wire key.
    #   2. Two NEW mode-gated create_session capabilities --
    #      `custom_agents_local_only` (empty-mode default True) and
    #      `enable_experimental_mode` (empty-mode default False). Both pinned
    #      (MinimalMode:MUST:17-18); under mode="copilot-cli" the empty-mode
    #      helpers return None, so unpinned they would inherit bundled-CLI
    #      defaults.
    #   3. `ReasoningEffort` Literal grows to 5 members: "max" is now
    #      SDK-native (was a documented provider fallback-allowlist extra
    #      through 1.0.7). The provider's forwarded set is UNCHANGED; "none"
    #      remains the sole remaining extra.
    #   4. 27 new SessionEventType members (all DROP; see
    #      config/data/events.yaml). `CopilotSession.send` gains keyword-only
    #      `source` (additive; the provider does not pass it, so the SDK
    #      default preserves pre-1.0.14 wire behavior).
    "github-copilot-sdk==1.0.14",
    # PyYAML for config loading
    "pyyaml>=6.0",
    # PEP 440 version parser used by the import-time SDK floor check
    # (`amplifier_module_provider_github_copilot.__init__._check_sdk_version`).
    # `packaging` is PyPA-maintained; declared explicitly because the
    # top-level `packaging` module is not guaranteed present in a minimal
    # venv (pip vendors it internally as `pip._vendor.packaging`, which
    # the top-level import cannot resolve).
    "packaging>=20",
    # Note: amplifier-core is provided by Amplifier runtime when module is loaded
    # Listed here for type hints only; not installed at runtime
]

[project.urls]
Homepage = "https://github.com/microsoft/amplifier-module-provider-github-copilot"
Repository = "https://github.com/microsoft/amplifier-module-provider-github-copilot"
Documentation = "https://github.com/microsoft/amplifier-module-provider-github-copilot#readme"

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pyright>=1.1.350",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21",
    "pytest-cov>=7.0.0",
    # amplifier-core from PyPI (binary wheels, no Rust compilation needed)
    # Floor bumped 1.3.0 → 2.0.0 to align with the runtime version actually
    # injected by the Amplifier CLI, which ships **2.0.1** (verified on a live
    # host and inside a clean DTU). The previous floor's rationale was stale in
    # a way that mattered: it claimed alignment with a CLI shipping "1.4.x" and
    # that message_models were "byte-identical across 1.2.6→1.4.1". Because the
    # constraint was an unbounded `>=1.3.0`, uv.lock resolved **1.3.3** — so the
    # entire test suite validated against 1.3.3 while production ran 2.0.1, a
    # full major version apart, silently. Re-locked to 2.x so the tested surface
    # is the shipped surface; suite verified green against 2.0.1 (1586 passed).
    #
    # NOTE (deliberately left for maintainer judgement): this floor is still
    # unbounded, which is the exact shape that allowed the 1.x→2.x drift above
    # to go unnoticed. A `,<3.0.0` cap would convert the next major-version
    # divergence into a loud resolution failure instead of a silent one,
    # consistent with how the SDK pin (`==`) and the mode-gated-capability test
    # force conscious decisions. Not applied here: capping is a policy call for
    # a dev-only dependency, and this change-set is an SDK bump.
    "amplifier-core>=2.0.0",
]

[project.entry-points."amplifier.modules"]
provider-github-copilot = "amplifier_module_provider_github_copilot:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_provider_github_copilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
]

# Type checking (pyright) is configured in the standalone `pyrightconfig.json`
# at the repo root — REQUIRED by the QualityGates tests
# (tests/test_test_quality.py::TestQualityGates) and used by `make pyright`.
# pyright honors pyrightconfig.json over [tool.pyright], so the config lives
# there as the single source of truth to avoid silent drift between the two.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# Live tests excluded by default (CI-friendly) - run with: pytest -m live
# Or run all tests with: pytest -m ""
# Contract: tests run and FAIL if credentials missing, never skip
addopts = "-m 'not live'"
markers = [
    "live: marks tests requiring real credentials (run explicitly with -m live)",
    "sdk_assumption: marks tests verifying SDK types/shapes exist",
    "security: marks tests verifying security invariants (injection, redaction, sanitization)",
    "posix_only: platform-gated contract; deselected (not skipped) on win32 — policy: run or fail, never skip",
    "windows_only: platform-gated contract; deselected (not skipped) on non-win32 — policy: run or fail, never skip",
]

# Note: [dependency-groups] removed — use [project.optional-dependencies] dev instead
# The pytest-cov dependency has been consolidated into [project.optional-dependencies] dev
